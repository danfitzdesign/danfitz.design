<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="description" content="Dan Fitzsimmons — Leading Brand Design at GoCardless." />
    <title>Dan Fitzsimmons</title>
    <link rel="preconnect" href="https://rsms.me" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230066ff'/%3E%3Cpath d='M9 9h6.2c5 0 7.8 2.6 7.8 7s-2.8 7-7.8 7H9V9Zm6 10.5c2.5 0 3.8-1.2 3.8-3.5S17.5 12.5 15 12.5h-1.9v7H15Z' fill='%23f9fafb'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="introduction" aria-labelledby="name">
      <div class="introduction__content">
        <div class="profile">
          <div class="portrait" aria-hidden="true">
            <img src="./assets/Dan.png" alt="" width="34" height="34" />
          </div>
          <header class="identity">
            <h1 id="name">Dan Fitzsimmons</h1>
            <p class="role">Leading Brand Design at GoCardless</p>
          </header>
        </div>
        <p class="bio">I specialise in building adaptable brand systems that help make complex ideas<br />clear and compelling.</p>

        <div class="contact-control" data-contact>
          <button class="contact-trigger" type="button" aria-expanded="false" aria-controls="contact-drawer">
            <span>Contact</span>
          </button>
          <div class="contact-drawer-clip" id="contact-drawer" aria-hidden="true" inert>
            <button class="contact-drawer" type="button" aria-label="Copy dan@danfitz.design to the clipboard">
              <span class="contact-email">dan@danfitz.design</span>
              <span class="copy-label" aria-hidden="true">Copy</span>
            </button>
          </div>
          <p class="sr-only" aria-live="polite" data-copy-status></p>
        </div>
      </div>
    </main>

    <script>
      (() => {
        const control = document.querySelector("[data-contact]");
        const trigger = control.querySelector(".contact-trigger");
        const drawerClip = control.querySelector(".contact-drawer-clip");
        const drawer = control.querySelector(".contact-drawer");
        const copyLabel = control.querySelector(".copy-label");
        const copyStatus = control.querySelector("[data-copy-status]");
        const email = "dan@danfitz.design";
        const motionReduced = window.matchMedia("(prefers-reduced-motion: reduce)");
        let closingTimer;
        let resetTimer;
        let hoverLocked = false;

        const clearClosingTimer = () => {
          window.clearTimeout(closingTimer);
        };

        const openDrawer = () => {
          if (hoverLocked) return;
          clearClosingTimer();
          control.classList.remove("is-closing");
          control.classList.add("is-open");
          trigger.setAttribute("aria-expanded", "true");
          drawerClip.setAttribute("aria-hidden", "false");
          drawerClip.inert = false;
        };

        const closeDrawer = (reason = "manual", lockHover = false) => {
          control.classList.remove("is-open");
          control.classList.add("is-closing");
          trigger.setAttribute("aria-expanded", "false");
          drawerClip.setAttribute("aria-hidden", "true");
          drawerClip.inert = true;
          if (reason === "copied") hoverLocked = lockHover;
          closingTimer = window.setTimeout(
            () => control.classList.remove("is-closing"),
            motionReduced.matches ? 0 : 640,
          );
        };

        const copyWithFallback = async () => {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(email);
            return;
          }
          const field = document.createElement("textarea");
          field.value = email;
          field.setAttribute("readonly", "");
          field.className = "sr-only";
          document.body.append(field);
          field.select();
          document.execCommand("copy");
          field.remove();
        };

        trigger.addEventListener("pointerenter", (event) => {
          if (event.pointerType === "mouse" && !hoverLocked) openDrawer();
        });
        control.addEventListener("pointerleave", (event) => {
          if (event.pointerType !== "mouse") return;
          hoverLocked = false;
          if (control.classList.contains("is-open")) {
            closeDrawer("hover-leave");
          }
        });
        trigger.addEventListener("focus", openDrawer);
        trigger.addEventListener("click", () => {
          hoverLocked = false;
          openDrawer();
        });
        control.addEventListener("focusout", () => {
          window.setTimeout(() => {
            if (!control.contains(document.activeElement)) closeDrawer("focus-leave");
          }, 0);
        });

        drawer.addEventListener("click", async (event) => {
          const shouldLockHover = event.pointerType === "mouse";
          try {
            await copyWithFallback();
            window.clearTimeout(resetTimer);
            control.classList.add("is-copied");
            drawer.classList.remove("is-bouncing");
            void drawer.offsetWidth;
            drawer.classList.add("is-bouncing");
            copyLabel.textContent = "Copied!";
            copyStatus.textContent = `${email} copied to the clipboard.`;
            window.setTimeout(
              () => closeDrawer("copied", shouldLockHover),
              motionReduced.matches ? 250 : 700,
            );
            resetTimer = window.setTimeout(() => {
              control.classList.remove("is-copied");
              drawer.classList.remove("is-bouncing");
              copyLabel.textContent = "Copy";
            }, motionReduced.matches ? 500 : 1450);
          } catch {
            copyStatus.textContent = "The email address could not be copied.";
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && control.classList.contains("is-open")) {
            closeDrawer();
            trigger.focus();
          }
        });
      })();
    </script>
  </body>
</html>
